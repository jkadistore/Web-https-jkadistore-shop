<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Masuk — JK Adistore</title>
<link rel="icon" href="assets/img/icon-192.png">
<style>
:root{--bg:#0b0716;--bg2:#1a0f38;--card:#241848;--card2:#2D1B69;--border:#372a78;--text:#fff;--muted:#b9b3d6;--gold:#FFD700;--gold2:#ffdf3d;--ok:#6dffb0;--err:#ff6d8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#2D1B69 0%,#1a0f38 45%,#0b0716 100%);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:18px}
.card{width:100%;max-width:400px;background:linear-gradient(180deg,#2D1B69,#241848);border:1px solid var(--border);border-radius:20px;padding:26px 22px 22px;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.logo{display:block;width:58px;height:58px;margin:0 auto 12px;border-radius:15px;box-shadow:0 6px 22px rgba(255,215,0,.18)}
h1{font-size:18.5px;text-align:center;margin:0 0 3px}
.sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 16px}
.tabs{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:13px;padding:4px;gap:4px;margin-bottom:16px}
.tab{flex:1;padding:10px 6px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:800;cursor:pointer;transition:.18s}
.tab.on{background:var(--gold);color:#241848}
.pane{display:none}.pane.on{display:block}
label{display:block;font-size:11.5px;font-weight:800;color:var(--gold2);margin:0 0 5px;text-transform:uppercase}
.field{margin-bottom:12px}
input{width:100%;padding:12.5px 14px;border-radius:11px;border:1px solid var(--border);background:#1a1233;color:var(--text);font-size:14.5px;outline:none}
input::placeholder{color:#7d75a3}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,.14)}
.btn-main{display:flex;align-items:center;justify-content:center;width:100%;padding:13.5px;border-radius:12px;border:0;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241848;font-size:15px;font-weight:900;cursor:pointer;margin-top:2px}
.btn-main[disabled]{opacity:.6}
.btn-alt{width:100%;padding:11px;border-radius:12px;border:1px solid var(--border);background:#1a1233;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0 12px;color:var(--muted);font-size:11px;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.socials{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn-soc{display:flex;align-items:center;justify-content:center;padding:11px 4px;border-radius:11px;border:1px solid var(--border);background:#1a1233;color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer;text-decoration:none;gap:6px}
.btn-soc svg{width:16px;height:16px}
.note{text-align:center;margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.5}
.note a{color:var(--gold2);text-decoration:none;font-weight:800}
.msg{display:none;margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:12.5px}
.msg.err{background:rgba(255,109,138,.12);border:1px solid rgba(255,109,138,.4);color:var(--err);display:block}
.msg.ok{background:rgba(109,255,176,.1);border:1px solid rgba(109,255,176,.35);color:var(--ok);display:block}
.otp-input{text-align:center;font-size:22px;letter-spacing:10px;font-weight:800;padding:16px}
.brand-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);text-align:center;font-size:10.5px;color:var(--muted)}
.brand-foot b{color:var(--gold)}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="assets/img/logo.png" alt="JK">
  <h1>JK ADISTORE</h1>
  <p class="sub">Masuk satu kali — langsung masuk toko.</p>

  <div class="tabs">
    <button class="tab on" id="tabMasuk" type="button">🔑 MASUK</button>
    <button class="tab" id="tabDaftar" type="button">📝 DAFTAR</button>
  </div>

  <div id="errBox" class="msg"></div>
  <div id="okBox" class="msg"></div>

  <!-- MASUK -->
  <div class="pane on" id="paneMasuk">
    <form id="formMasuk" novalidate>
      <div class="field"><label>Email</label><input id="mEmail" type="email" placeholder="nama@email.com" required></div>
      <div class="field"><label>Kata Sandi</label><input id="mPass" type="password" placeholder="••••••••" required></div>
      <button class="btn-main" id="btnMasuk" type="submit">MASUK SEKARANG</button>
    </form>
    <p class="note"><a href="#" id="toLupa">🔑 Lupa kata sandi?</a></p>
  </div>

  <!-- OTP -->
  <div class="pane" id="paneOtp">
    <p style="text-align:center;font-size:13px;color:var(--muted);margin:0 0 14px">Kode 6 digit dikirim ke <b id="otpEmail" style="color:var(--gold2)"></b></p>
    <div class="field"><label>Kode OTP</label><input id="otpCode" class="otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code"></div>
    <button class="btn-main" id="btnOtp" type="button">VERIFIKASI &amp; MASUK</button>
    <button class="btn-alt" id="btnBack" type="button">← Kembali</button>
  </div>

  <!-- LUPA -->
  <div class="pane" id="paneLupa">
    <form id="formLupa1" novalidate>
      <div class="field"><label>Email akun kamu</label><input id="lEmail" type="email" placeholder="nama@email.com" required></div>
      <button class="btn-main" id="btnLupa1" type="submit">KIRIM KODE 6 DIGIT</button>
    </form>
    <form id="formLupa2" style="display:none" novalidate>
      <div class="field"><label>Kode 6 digit</label><input id="lCode" class="otp-input" type="text" maxlength="6" inputmode="numeric" placeholder="000000"></div>
      <div class="field"><label>Sandi baru</label><input id="lPass" type="password" placeholder="Min. 6 karakter"></div>
      <div class="field"><label>Ulangi sandi</label><input id="lPass2" type="password" placeholder="Ulangi"></div>
      <button class="btn-main" id="btnLupa2" type="submit">GANTI SANDI</button>
    </form>
    <button class="btn-alt" id="backMasuk" type="button">← Kembali</button>
  </div>

  <!-- DAFTAR -->
  <div class="pane" id="paneDaftar">
    <form id="formDaftar" novalidate>
      <div class="field"><label>Nama Lengkap</label><input id="dNama" type="text" placeholder="Nama kamu" maxlength="40" required></div>
      <div class="field"><label>Email</label><input id="dEmail" type="email" placeholder="nama@email.com" required></div>
      <div class="field"><label>Nomor WhatsApp</label><input id="dWa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx" maxlength="18" required></div>
      <div class="field"><label>Kata Sandi</label><input id="dPass" type="password" placeholder="Min. 6 karakter" required></div>
      <button class="btn-main" id="btnDaftar" type="submit">DAFTAR &amp; MASUK</button>
    </form>
    <p class="note">Sudah punya akun? <a href="#" id="toMasuk">Masuk di sini</a></p>
  </div>

  <div class="divider">atau masuk cepat</div>
  <div class="socials">
    <a class="btn-soc" href="#"><svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.9v3.7h5.2c-.2 1.3-1.6 3.8-5.2 3.8-3.1 0-5.7-2.6-5.7-5.8s2.6-5.8 5.7-5.8c1.8 0 3 .8 3.7 1.4l2.5-2.4C16.8 4.4 14.6 3.5 12 3.5 6.9 3.5 2.7 7.6 2.7 12.7S6.9 21.9 12 21.9c6.9 0 8.9-4.8 8.9-7.3 0-.5 0-.9-.1-1.3H12z"/></svg>Google</a>
    <a class="btn-soc" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.17c0 4.48 2.87 8.28 6.84 9.62.5.1.68-.22.68-.48 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.57 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.48A10.02 10.02 0 0 0 22 12.17C22 6.58 17.52 2 12 2z"/></svg>GitHub</a>
    <a class="btn-soc" href="#"><svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.4 3l-.3.5c1.8.5 2.9 1.2 4 2-1.7-.8-3.4-1.2-5.1-1.2s-3.4.4-5.1 1.2c1.1-.9 2.4-1.5 4-2L12.6 3a19.7 19.7 0 0 0-4.9 1.4C4.6 8.5 3.9 12.5 4.2 16.4a19.9 19.9 0 0 0 5.8 2.9l.9-1.3c-1-.3-1.9-.8-2.8-1.4l.7-.5c2.8 1.3 5.8 1.3 8.5 0l.7.5c-.9.6-1.8 1-2.8 1.4l.9 1.3a19.8 19.8 0 0 0 5.8-2.9c.4-4.4-.7-8.4-3.5-12zM9.7 14c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8zm4.6 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8z"/></svg>Discord</a>
  </div>
  <div class="brand-foot">🛡️ <b>JK ADISTORE</b> — Raja Digital Store Indonesia</div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var next = params.get('next') || '/';

  var errBox = document.getElementById('errBox');
  var okBox = document.getElementById('okBox');
  function showErr(m){ errBox.textContent=m; errBox.className='msg err'; errBox.style.display='block'; okBox.style.display='none'; }
  function showOk(m){ okBox.textContent=m; okBox.className='msg ok'; okBox.style.display='block'; errBox.style.display='none'; }
  function hideMsg(){ errBox.style.display='none'; okBox.style.display='none'; }

  function setPane(id){
    ['paneMasuk','paneOtp','paneLupa','paneDaftar'].forEach(function(p){
      var el = document.getElementById(p);
      if (el) el.classList.toggle('on', p === id);
    });
    document.getElementById('tabMasuk').classList.toggle('on', id === 'paneMasuk');
    document.getElementById('tabDaftar').classList.toggle('on', id === 'paneDaftar');
    hideMsg();
  }

  document.getElementById('tabMasuk').onclick = function(){ setPane('paneMasuk'); };
  document.getElementById('tabDaftar').onclick = function(){ setPane('paneDaftar'); };
  document.getElementById('toDaftar').onclick = function(e){ e.preventDefault(); setPane('paneDaftar'); };
  document.getElementById('toMasuk').onclick = function(e){ e.preventDefault(); setPane('paneMasuk'); };
  document.getElementById('toLupa').onclick = function(e){ e.preventDefault(); setPane('paneLupa'); };
  document.getElementById('backMasuk').onclick = function(){ setPane('paneMasuk'); };
  document.getElementById('btnBack').onclick = function(){ setPane('paneMasuk'); };

  var currentEmail = '';
  var currentAction = 'login';

  // ==== MASUK ====
  document.getElementById('formMasuk').onsubmit = async function(e){
    e.preventDefault();
    hideMsg();
    var email = document.getElementById('mEmail').value.trim().toLowerCase();
    var pass = document.getElementById('mPass').value;
    if (!email || !pass) { showErr('Isi email & password'); return; }

    var btn = document.getElementById('btnMasuk');
    btn.disabled = true; btn.textContent = 'MEMPROSES...';

    try {
      var r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email, password: pass, next})
      });
      var j = await r.json();
      if (!r.ok || !j.success) { showErr(j.error || 'Gagal login'); btn.disabled=false; btn.textContent='MASUK SEKARANG'; return; }

      if (j.otp_required) {
        currentEmail = email;
        currentAction = 'login';
        document.getElementById('otpEmail').textContent = email;
        setPane('paneOtp');
        showOk('📧 Kode OTP terkirim! Cek email.');
        setTimeout(function(){ document.getElementById('otpCode').focus(); }, 200);
      }
    } catch(err) {
      showErr('Koneksi error: ' + err.message);
      btn.disabled=false; btn.textContent='MASUK SEKARANG';
    }
  };

  // ==== OTP VERIFY ====
  document.getElementById('btnOtp').onclick = async function(){
    hideMsg();
    var code = document.getElementById('otpCode').value.trim();
    if (!/^[0-9]{6}$/.test(code)) { showErr('Kode harus 6 angka'); return; }

    var btn = document.getElementById('btnOtp');
    btn.disabled = true; btn.textContent = 'VERIFIKASI...';

    try {
      var r = await fetch('/api/otp/verify', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email: currentEmail, code: code})
      });
      var j = await r.json();
      if (!r.ok || !j.success) { showErr(j.error || 'Kode salah'); btn.disabled=false; btn.textContent='VERIFIKASI & MASUK'; return; }

      // Set session
      var u = j.user || {email: currentEmail, role: 'user'};
      var sess = {
        session: {
          role: u.role === 'owner' ? 'owner' : 'user',
          ot: j.token,
          user: {email: currentEmail, name: u.name || currentEmail, role: u.role || 'user'},
          st: Date.now()
        }
      };
      localStorage.setItem('jka_dv', JSON.stringify(sess));
      localStorage.setItem('jka_token', j.token);
      localStorage.setItem('token', j.token);
      if (u.role === 'owner') localStorage.setItem('jka_admin', 'true');
      localStorage.setItem('user', JSON.stringify({email: currentEmail, name: u.name || currentEmail, role: u.role || 'user'}));
      localStorage.setItem('jka_initialized', '1');

      showOk('✅ Login berhasil!');
      setTimeout(function(){ window.location.href = next || '/'; }, 600);
    } catch(err) {
      showErr('Koneksi error: ' + err.message);
      btn.disabled=false; btn.textContent='VERIFIKASI & MASUK';
    }
  };

  // ==== DAFTAR ====
  document.getElementById('formDaftar').onsubmit = async function(e){
    e.preventDefault();
    hideMsg();
    var name = document.getElementById('dNama').value.trim();
    var email = document.getElementById('dEmail').value.trim().toLowerCase();
    var wa = document.getElementById('dWa').value.trim();
    var pass = document.getElementById('dPass').value;
    if (!name || name.length < 2) { showErr('Nama minimal 2 karakter'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Format email tidak valid'); return; }
    if (!wa || wa.length < 8) { showErr('Nomor WA tidak valid'); return; }
    if (!pass || pass.length < 6) { showErr('Password minimal 6 karakter'); return; }

    var btn = document.getElementById('btnDaftar');
    btn.disabled = true; btn.textContent = 'MEMBUAT AKUN...';

    try {
      var r = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name, email, wa, password: pass, next})
      });
      var j = await r.json();
      if (!r.ok || !j.success) { showErr(j.error || 'Gagal daftar'); btn.disabled=false; btn.textContent='DAFTAR & MASUK'; return; }

      if (j.otp_required) {
        currentEmail = email;
        currentAction = 'register';
        document.getElementById('otpEmail').textContent = email;
        setPane('paneOtp');
        showOk('📧 Kode verifikasi terkirim! Cek email.');
        setTimeout(function(){ document.getElementById('otpCode').focus(); }, 200);
      }
    } catch(err) {
      showErr('Koneksi error: ' + err.message);
      btn.disabled=false; btn.textContent='DAFTAR & MASUK';
    }
  };

  // ==== LUPA ====
  document.getElementById('formLupa1').onsubmit = async function(e){
    e.preventDefault();
    hideMsg();
    var email = document.getElementById('lEmail').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('Format email tidak valid'); return; }

    var btn = document.getElementById('btnLupa1');
    btn.disabled = true; btn.textContent = 'MENGIRIM...';

    try {
      var r = await fetch('/api/auth/forgot', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email})
      });
      var j = await r.json();
      if (!r.ok || !j.success) { showErr(j.error || 'Gagal kirim'); btn.disabled=false; btn.textContent='KIRIM KODE 6 DIGIT'; return; }

      currentEmail = email;
      document.getElementById('formLupa1').style.display = 'none';
      document.getElementById('formLupa2').style.display = '';
      showOk('📧 Kode reset terkirim!');
    } catch(err) {
      showErr('Koneksi error: ' + err.message);
      btn.disabled=false; btn.textContent='KIRIM KODE 6 DIGIT';
    }
  };

  document.getElementById('formLupa2').onsubmit = async function(e){
    e.preventDefault();
    hideMsg();
    var code = document.getElementById('lCode').value.trim();
    var p1 = document.getElementById('lPass').value;
    var p2 = document.getElementById('lPass2').value;
    if (!/^\d{6}$/.test(code)) { showErr('Kode harus 6 angka'); return; }
    if (p1.length < 6) { showErr('Sandi minimal 6 karakter'); return; }
    if (p1 !== p2) { showErr('Konfirmasi sandi tidak cocok'); return; }

    var btn = document.getElementById('btnLupa2');
    btn.disabled = true; btn.textContent = 'MENYIMPAN...';

    try {
      var r = await fetch('/api/auth/forgot/verify', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email: currentEmail, code, password: p1, next})
      });
      var j = await r.json();
      if (!r.ok || !j.success) { showErr(j.error || 'Kode/sandi salah'); btn.disabled=false; btn.textContent='GANTI SANDI'; return; }

      showOk('✅ Sandi berhasil diganti!');
      setTimeout(function(){ setPane('paneMasuk'); }, 1200);
    } catch(err) {
      showErr('Koneksi error: ' + err.message);
      btn.disabled=false; btn.textContent='GANTI SANDI';
    }
  };

  // Enter key handler
  document.getElementById('mPass').addEventListener('keypress', function(e){ if(e.key==='Enter') document.getElementById('formMasuk').dispatchEvent(new Event('submit')); });
  document.getElementById('otpCode').addEventListener('keypress', function(e){ if(e.key==='Enter') document.getElementById('btnOtp').click(); });
})();
</script>
</body>
</html>
